:root{color-scheme:light;--a:#E25C8F;--ad:#B8336B;--as:#FFE3EC;--bg:#FFF4F7;--ink:#3B2340;--mut:#6E5468;--card:#fff;--mint:#DDF5EE;--mintd:#1C7562;--sun:#FFF0D6;--sund:#8A5200;--gold:#F2A93B}

.hrow{display:flex;justify-content:space-between;align-items:center;gap:12px}

.tk{margin-top:14px;background:rgba(255,255,255,.22);border-radius:16px;overflow:hidden;white-space:nowrap;padding:9px 0;font-weight:700;font-size:15px}

.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.big{font-family:'Baloo Bhaijaan 2';font-size:40px;line-height:1;color:var(--ad)}

.scroll{overflow-x:auto;margin-inline:-4px}
.pt{border-collapse:separate;border-spacing:0;width:100%;min-width:400px;font-size:14px}

.nmb{border:0;background:none;display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px;padding:4px 0;min-height:40px}
.dots{display:inline-flex;gap:4px}.dt{width:14px;height:14px;border-radius:50%;border:2px solid #C9B8C4;display:inline-block}

.jz summary::-webkit-details-marker{display:none}
.jz summary::before{content:'';width:8px;height:8px;border-inline-start:2.5px solid var(--ad);border-bottom:2.5px solid var(--ad);transform:rotate(-45deg);transition:transform .2s}

.hz{overflow:auto;margin-inline:-6px}.hz svg{display:block;width:100%;height:auto}.hz.z svg{width:230%}
